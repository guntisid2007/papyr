name: Conversion validation

# Runs the whole conversion matrix, the edge cases, and the window smoke tests on each platform, and keeps each
# platform's matrix report. A pass on one platform says nothing about the others, so each report stands alone.
# Then it builds that platform's package and runs the packaged app's self-test. Nothing here publishes anything.

on:
  push:
    branches: ["test/**"]
    paths: ["src/**", "tests/**", "requirements*.txt", "papyr.spec", "assets/icon.*",
            ".github/workflows/conversion-validation.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "requirements*.txt", ".github/workflows/conversion-validation.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90  # the Intel macOS runners take about 20 minutes for the matrix alone
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            slug: macos-arm64
            os: macos-15
            machine: arm64
          - name: macOS Intel
            slug: macos-x64
            os: macos-15-intel
            machine: x86_64
          - name: Windows
            slug: windows-x64
            os: windows-latest
            machine: AMD64
          - name: Linux
            slug: linux-x64
            os: ubuntu-22.04
            machine: x86_64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # Qt needs these to start offscreen; DejaVu gives the Greek and Cyrillic fixture text real glyphs.
      - name: Install Qt runtime libraries and fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            fonts-dejavu-core

      # A runner label is not proof of its CPU. Python's own architecture must match too, or the Intel job could
      # quietly test Apple Silicon wheels (or the reverse) through Rosetta.
      - name: Check the runner architecture
        shell: python
        run: |
          import platform, sys
          print(platform.platform(), platform.machine(), sys.version)
          assert platform.machine() == "${{ matrix.machine }}", f"expected ${{ matrix.machine }}, got {platform.machine()}"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # A missing codec would turn its matrix pairs into skips, so it fails here, by name, instead.
      - name: Check codec support
        run: >
          python -c "import PIL.features as f, pillow_heif;
          print('avif', f.check('avif'), f.version('avif'), 'webp', f.version('webp'), 'libheif', pillow_heif.libheif_version());
          assert f.check('avif') and f.check('webp') and pillow_heif.libheif_version(), 'a codec is missing'"

      - name: Conversion matrix
        run: >
          python -m pytest tests/test_conversion_matrix.py tests/test_validator_sensitivity.py -v -rs
          -p no:cacheprovider --report-dir reports/${{ matrix.slug }}
          --junitxml reports/${{ matrix.slug }}/matrix-junit.xml

      - name: Every supported pair ran and passed
        if: success() || failure()
        shell: python
        run: |
          import json, pathlib
          counts = json.loads(pathlib.Path("reports/${{ matrix.slug }}/run-summary.json").read_text())["counts"]
          print(json.dumps(counts, indent=1))
          supported = counts["declared"].get("SUPPORTED", 0)
          assert supported and counts["pair_status"].get("PASSED", 0) == supported, "a supported pair did not pass"
          assert counts["conversion_status"]["SKIPPED"] == 0, "a conversion was skipped"
          assert counts["conversion_status"]["FAILED"] == 0, "a conversion failed"

      - name: Behavior, edge cases, and window
        if: success() || failure()
        run: >
          python -m pytest tests -v -rs -p no:cacheprovider
          --ignore=tests/test_conversion_matrix.py --ignore=tests/test_validator_sensitivity.py
          --junitxml reports/${{ matrix.slug }}/suite-junit.xml

      # Totals for the report, with every skip named. A skip is allowed only where the test itself says why.
      - name: Test totals
        if: success() || failure()
        shell: python
        run: |
          import pathlib, xml.etree.ElementTree as ET
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for name in ("matrix-junit.xml", "suite-junit.xml"):
              path = pathlib.Path("reports/${{ matrix.slug }}") / name
              if not path.exists():
                  print(f"{name}: missing"); continue
              for suite in ET.parse(path).getroot().iter("testsuite"):
                  for key in totals:
                      totals[key] += int(suite.get(key, 0))
                  for case in suite.iter("testcase"):
                      for skip in case.findall("skipped"):
                          print(f"SKIPPED {case.get('classname')}::{case.get('name')}: {skip.get('message')}")
          print(totals)
          summary = pathlib.Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(f"### ${{ matrix.name }}\n\n{totals}\n")

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conversion-matrix-${{ matrix.slug }}
          path: reports/${{ matrix.slug }}
          if-no-files-found: error

  package:
    name: Package ${{ matrix.name }}
    needs: validate
    if: success() || failure()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            arch: arm64
            asset: Papyr-macOS-AppleSilicon.zip
          - name: macOS Intel
            os: macos-15-intel
            arch: x86_64
            asset: Papyr-macOS-Intel.zip
          - name: Windows
            os: windows-latest
            asset: Papyr-Windows.zip
          - name: Linux
            os: ubuntu-22.04
            asset: Papyr-Linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean --distpath ci-dist --workpath ci-build papyr.spec

      # The self-test converts HEIC, PDF, notebooks, every image encoder, animation timing, refuses an encrypted
      # PDF, checks the no-replace move, and opens the window, all through the bundle's own libraries.
      - name: Smoke test and package (macOS)
        if: runner.os == 'macOS'
        env:
          PAPYR_SETTINGS_DIR: ${{ runner.temp }}/papyr-settings
        run: |
          APP="ci-dist/Papyr.app"
          BIN="$APP/Contents/MacOS/Papyr"
          test "$(lipo -archs "$BIN")" = "${{ matrix.arch }}"
          ls "$APP/Contents/Frameworks/PySide6/Qt/plugins/platforms"
          "$BIN" --self-test tests/fixtures/sample.heic
          ditto -c -k --sequesterRsrc --keepParent "$APP" "${{ matrix.asset }}"
          mkdir unpacked && ditto -x -k "${{ matrix.asset }}" unpacked
          test -x unpacked/Papyr.app/Contents/MacOS/Papyr
          unpacked/Papyr.app/Contents/MacOS/Papyr --self-test tests/fixtures/sample.heic

      - name: Smoke test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PAPYR_SETTINGS_DIR: ${{ runner.temp }}\papyr-settings
        run: |
          $p = Start-Process -FilePath "ci-dist\Papyr\Papyr.exe" `
            -ArgumentList '--self-test', 'tests\fixtures\sample.heic' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
          Compress-Archive -Path "ci-dist\Papyr" -DestinationPath "${{ matrix.asset }}"

      - name: Smoke test and package (Linux)
        if: runner.os == 'Linux'
        env:
          PAPYR_SETTINGS_DIR: ${{ runner.temp }}/papyr-settings
        run: |
          "ci-dist/Papyr/Papyr" --self-test tests/fixtures/sample.heic
          tar -C ci-dist -czf "${{ matrix.asset }}" "Papyr"

      - name: Checksum
        shell: python
        run: |
          import hashlib, pathlib
          asset = pathlib.Path("${{ matrix.asset }}")
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          pathlib.Path(f"{asset}.sha256").write_text(f"{digest}  {asset.name}\n")
          print(digest, asset.name, asset.stat().st_size)

      # A CI artifact for testing only, kept two weeks. It is not a release and is not signed or notarized.
      - uses: actions/upload-artifact@v7
        with:
          name: ci-package-${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          retention-days: 14
          if-no-files-found: error
