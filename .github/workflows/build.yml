name: Test, build, and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            asset: Papyr-macOS-AppleSilicon.zip
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            asset: Papyr-macOS-Intel.zip
            arch: x86_64
          - name: Windows
            os: windows-latest
            asset: Papyr-Windows.zip
          - name: Linux
            os: ubuntu-22.04
            asset: Papyr-Linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean papyr.spec

      - name: Smoke test and package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="dist/Papyr.app"
          BIN="$APP/Contents/MacOS/Papyr"
          test "$(lipo -archs "$BIN")" = "${{ matrix.arch }}"
          "$BIN" --self-test tests/fixtures/sample.heic
          ditto -c -k --sequesterRsrc --keepParent "$APP" "${{ matrix.asset }}"

      - name: Smoke test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Papyr\Papyr.exe" `
            -ArgumentList '--self-test', 'tests\fixtures\sample.heic' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
          Compress-Archive -Path "dist\Papyr" -DestinationPath "${{ matrix.asset }}"

      - name: Smoke test and package (Linux)
        if: runner.os == 'Linux'
        run: |
          "dist/Papyr/Papyr" --self-test tests/fixtures/sample.heic
          tar -C dist -czf "${{ matrix.asset }}" "Papyr"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Create release with the builds that passed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(assets/*)
          if [ ${#files[@]} -eq 0 ]; then echo "No build passed; nothing to publish." >&2; exit 1; fi
          (cd assets && sha256sum *) > SHA256SUMS.txt
          gh release create "$TAG" "${files[@]}" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
            --title "Papyr $TAG" --generate-notes
