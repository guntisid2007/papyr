[project]
name = "papyr"
version = "2.3.0"
description = "Papyr: a free, offline desktop converter between HEIC, JPEG, PNG, WebP, AVIF, TIFF, BMP, GIF, and PDF, and from Jupyter notebooks to PDF."
license = "MIT"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
